name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==0.9.5"

      - name: Install the package from the lock
        run: uv sync --frozen --extra dev --python 3.11

      - name: Put the locked environment on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dashboard
        working-directory: frontend
        run: npm ci

      - name: Test the dashboard
        working-directory: frontend
        run: npm test

      - name: Typecheck the dashboard
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build the dashboard
        working-directory: frontend
        run: npx vite build
